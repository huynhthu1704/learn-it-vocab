<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn IT Vocab</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="theme-color" content="#2563EB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="logo" href="#home" data-notr><svg width="36" height="36" viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><path d="M10 5h28a6 6 0 0 1 6 6v19a6 6 0 0 1-6 6H23l-9.5 7.5V36H10a6 6 0 0 1-6-6V11a6 6 0 0 1 6-6z" fill="url(#lgm)"/><path d="M17 14.5l-5.5 6 5.5 6M31 14.5l5.5 6-5.5 6" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M26.5 12.5l-5 16" stroke="#FDE68A" stroke-width="3.2" stroke-linecap="round"/></svg><span>Learn <b style="color:var(--blue)">IT</b> Vocab</span></a>
    <div class="links" id="links">
      <a href="#home" data-nav="home">Home</a>
      <a href="#browse" data-nav="browse">Browse words</a>
      <a href="#workplace" data-nav="workplace">Workplace English</a>
      <a href="#flashcards" data-nav="flashcards">Flashcards</a>
      <a href="#quiz" data-nav="quiz">Quiz</a>
      <a href="#lists" data-nav="lists">My lists</a>
      <a href="#progress" data-nav="progress">My profile</a>
      <a href="#admin" data-nav="admin" id="navAdmin" style="display:none">Admin</a>
    </div>
    <div class="navr">
      <span class="chip hide-sm" id="streakChip" title="Days in a row with practice"></span>
      <span class="chip" id="knownChip" title="Words you know"></span>
      <span id="navAccount"></span>
      <button class="langbtn" id="navLang" title="Languages" aria-label="Languages"></button>
      <button class="menu-btn" id="menuBtn" aria-label="Menu"><span data-icon="menu" data-c="#1B1F2A" data-s="20"></span></button>
    </div>
  </div>
</nav>
<div class="focusbar" id="focusBar" role="status"><div class="wrap">
  <span data-icon="meeting" data-c="#7C3AED" data-s="18"></span>
  <span class="grow" id="focusText"></span>
  <a class="btn sm solid" href="#browse" id="focusBrowse">See the words</a>
  <button class="btn sm ghost" id="focusClear">Show all roles</button>
</div></div>

<!--__PAGES__-->
<footer><div class="wrap"><span><b style="color:var(--ink)" data-notr>Learn IT Vocab</b> · <span id="footCount"></span> · <span>3 levels</span> · <span>9 roles</span> · <span data-notr>English, Tiếng Việt, 한국어, Français</span></span><span>Pronunciation: IPA (American) + your device's voice</span></div></footer>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div class="dlg" id="dlg"><div class="box" id="dlgBox"></div></div>
<div class="langpop" id="langPop"></div>
<div class="topbar" id="topbar"><i></i></div>
<div class="busy" id="busy"><div class="spinner"></div><div id="busyText">Loading…</div></div>
<div class="bulkbar" id="bulkbar"><span id="bulkCount"></span>
  <button class="btn sm" data-bulk="known">✓ Mark as learnt</button><button class="btn sm" data-bulk="learning">Still learning</button>
  <button class="btn sm" data-bulk="save">★ Save</button><button class="btn sm" data-bulk="unsave">Remove from saved</button>
  <button class="btn sm" data-bulk="reset">Reset to new</button><button class="btn sm" data-bulk="clear">✕ Done</button></div>

<script src="app.js"></script>

<script type="module" src="cloud.js"></script>
</body>
</html>
