<main id="v-flashcards" class="view">
  <div class="wrap page-head center" style="text-align:center"><h1>Flashcards</h1><p>Look at the word, say it, then flip. Words you miss come back again.</p></div>
  <div class="wrap">
    <div class="setup">
      <select class="sel" id="fcLevel"></select>
      <select class="sel" id="fcRole"></select>
      <select class="sel" id="fcMode"><option value="due">Due for review</option><option value="new">New and learning words</option><option value="all">All words</option><option value="saved">Saved words ★</option></select>
      <button class="btn primary sm" id="fcStart">Start a set of 10</button>
    </div>
    <div class="fc-wrap" id="fcArea"></div>
  </div>
</main>
